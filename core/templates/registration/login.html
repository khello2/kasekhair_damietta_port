{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | قاصد خير</title>
    <link rel="stylesheet" href="https://jsdelivr.net">
    <style>
        body {
            background-color: #f0f2f5; /* لون خلفية فيسبوك */
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        .login-container {
            max-width: 400px;
            width: 100%;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgba(0, 0, 0, .1), 0 8px 16px rgba(0, 0, 0, .1);
            text-align: center;
        }
        .logo { width: 150px; margin-bottom: 20px; }
        .btn-login {
            background-color: #1877f2; /* أزرق فيسبوك */
            border: none;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 10px;
        }
        .btn-login:hover { background-color: #166fe5; }
        .form-control {
            padding: 12px;
            font-size: 1rem;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="login-container">
    <img src="{% static 'images/logo.png' %}" class="logo" alt="Logo">
    <h4 class="mb-4 fw-bold text-navy">مشروع ميناء دمياط</h4>
    
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <input type="text" name="username" class="form-control" placeholder="اسم المستخدم" required>
        </div>
        <div class="mb-3">
            <input type="password" name="password" class="form-control" placeholder="كلمة السر" required>
        </div>
        
        {% if form.errors %}
        <div class="alert alert-danger py-2 small">خطأ في الاسم أو كلمة السر</div>
        {% endif %}

        <button type="submit" class="btn btn-primary btn-login w-100 mt-2">تسجيل الدخول</button>
    </form>
    
    <hr class="my-4">
    <p class="text-muted small">نظام إدارة العمليات الفنية © 2026</p>
</div>

</body>
</html>
